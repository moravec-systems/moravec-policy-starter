policy_name: GPT_6_Astra_Direct_EEF
protocol: ws
host: 127.0.0.1
port: 6000
action_type: ee
eval_batch: false
model: gpt-6-astra
reasoning_effort: low
image_size: 384
# Travel per env step and gripper hold time used to turn each goal into an action chunk.
max_step_m: 0.01
max_chunk: 100
gripper_dwell_steps: 10
# Describe the world frame and workspace so the model can name positions.
scene_notes: >-
  ARX X5 world frame: +z is up and the table top is at z = 0.765. Arm bases are at
  left (-0.30, -0.45, 0.765) and right (0.30, -0.45, 0.765); reach is about 0.8 m.
  Positions are the wrist flange, not the fingertips: the fingertip centre is 0.15 m
  further along the gripper's pointing direction (straight down for top-down grasps),
  so to grasp an object at height h put the flange at z = h + 0.15.
