# Sample submission manifest: see INTEGRATION.md#submitting-a-policy.
schema: moravec.policy/v1
name: demo-policy
version: "1.0.0"
image: registry.example.com/team/demo-policy@sha256:<digest>
checkpoint: null                     # synthetic actions; no weights
serve:
  command: [python, setup_policy_server.py, --config_path, policy/demo_policy/deploy.yml, --host, 0.0.0.0]
  port: 6000
  startup_timeout_s: 60
resources:
  gpu_count: 0
secrets: []
interface:
  robot: yam
  action_type: joint
  cameras: {}                        # ignores observation content
  chunk_steps: 2
  batching: true
