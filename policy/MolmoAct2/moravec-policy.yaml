# Sample submission manifest: see INTEGRATION.md#submitting-a-policy.
schema: moravec.policy/v1
name: molmoact2-bimanual-yam
version: "8dcbed6"
image: registry.example.com/team/molmoact2@sha256:<digest>
checkpoint: /app/policy/MolmoAct2/checkpoints/BimanualYAM
serve:
  command: [python, setup_policy_server.py, --config_path, policy/MolmoAct2/deploy.yml, --host, 0.0.0.0]
  port: 6000
  startup_timeout_s: 600
resources:
  gpu_count: 1
  min_gpu_memory_gb: 48              # checked on a 48 GB GPU; the model may need less
secrets: []
interface:
  robot: yam
  action_type: joint
  cameras: [top, left, right]
  chunk_steps: 30
  batching: false
