services:
  policy:
    build: .
    environment:
      MORAVEC_POLICY_TOKEN: ${MORAVEC_POLICY_TOKEN:?Set a private policy token}
    ports:
      - "127.0.0.1:8000:8000"
    networks: [station]
    read_only: true
    tmpfs: ["/tmp"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
networks:
  station:
    internal: true
