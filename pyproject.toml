[project]
name = "moravec-policy-starter"
version = "0.1.0"
description = "Versioned policy contracts and source-pinned robot model examples"
requires-python = ">=3.10"
dependencies = ["pydantic>=2.10,<3", "numpy>=1.26,<3", "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "httpx>=0.28,<1"]
[project.scripts]
moravec-policy = "moravec_policy.cli:main"
[dependency-groups]
dev = ["pytest>=8,<9", "ruff>=0.11,<1"]
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.pytest.ini_options]
testpaths = ["tests"]
[tool.ruff]
line-length = 100
[tool.hatch.build.targets.wheel]
packages = ["src/moravec_policy"]
